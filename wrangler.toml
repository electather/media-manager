name = "app"
main = "packages/server/src/worker.ts"
compatibility_date = "2026-04-01"
compatibility_flags = ["nodejs_compat"]

# Workers Logs — inherited by [env.nightly] and [env.production] since
# `observability` is an inheritable key. Enables the per-Worker Logs
# dashboard + `wrangler tail`; `invocation_logs: true` (the default) keeps
# the one-line request summary every Worker invocation already emits.
[observability.logs]
enabled = true
invocation_logs = true

[assets]
directory = "./packages/client/dist"
# Serve `index.html` (200 OK) for any path that doesn't match a built asset
# so client-side router routes (e.g. /auth/login) work on direct navigation
# and page refresh. Without this, Cloudflare Assets 404s unmatched paths.
not_found_handling = "single-page-application"

# Default environment is used for PR preview deployments. Secrets
# (SQLITE_PATH, LIBSQL_AUTH_TOKEN, BETTER_AUTH_SECRET, BETTER_AUTH_URL,
# ENCRYPTION_KEY, APP_EXTERNAL_URL) are injected via `wrangler secret put`
# in the deploy workflow before each preview deploy.

[env.nightly]
name = "app-nightly"

[env.production]
name = "app-production"
