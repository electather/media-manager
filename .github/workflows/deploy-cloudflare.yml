name: Deploy (Cloudflare)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: cloudflare-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  # Deploys to the target Cloudflare Workers environment. Dispatch matrix:
  #   - PR opened / synchronized / reopened → preview Worker `app-pr-<number>`
  #   - push to `main`                       → named env `nightly`
  #   - release tag `v*`                     → named env `production`
  deploy:
    name: Deploy Worker
    if: >-
      github.event_name != 'pull_request' ||
      github.event.action != 'closed'
    runs-on: [media-manager, sandboxed]
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Build client SPA
        run: vp run build:client

      - name: Resolve deploy target
        id: target
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "mode=preview" >> "$GITHUB_OUTPUT"
            echo "worker_name=app-pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
            echo "wrangler_flags=--name app-pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
            echo "turso_url_secret=TURSO_URL_PREVIEW" >> "$GITHUB_OUTPUT"
            echo "turso_token_secret=TURSO_AUTH_TOKEN_PREVIEW" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "mode=production" >> "$GITHUB_OUTPUT"
            echo "worker_name=app-production" >> "$GITHUB_OUTPUT"
            echo "wrangler_flags=--env production" >> "$GITHUB_OUTPUT"
            echo "turso_url_secret=TURSO_URL_PRODUCTION" >> "$GITHUB_OUTPUT"
            echo "turso_token_secret=TURSO_AUTH_TOKEN_PRODUCTION" >> "$GITHUB_OUTPUT"
          else
            echo "mode=nightly" >> "$GITHUB_OUTPUT"
            echo "worker_name=app-nightly" >> "$GITHUB_OUTPUT"
            echo "wrangler_flags=--env nightly" >> "$GITHUB_OUTPUT"
            echo "turso_url_secret=TURSO_URL_NIGHTLY" >> "$GITHUB_OUTPUT"
            echo "turso_token_secret=TURSO_AUTH_TOKEN_NIGHTLY" >> "$GITHUB_OUTPUT"
          fi

      - name: Run database migrations
        env:
          SQLITE_PATH: ${{ secrets[steps.target.outputs.turso_url_secret] }}
          LIBSQL_AUTH_TOKEN: ${{ secrets[steps.target.outputs.turso_token_secret] }}
          # Satisfy env schema during the one-off migrate run; migrate.ts only
          # uses SQLITE_PATH / LIBSQL_AUTH_TOKEN but the schema requires these.
          BETTER_AUTH_SECRET: migration-noop
          BETTER_AUTH_URL: http://localhost
          ENCRYPTION_KEY: migration-noop
          APP_EXTERNAL_URL: http://localhost
        run: vp run db:migrate

      # Preview Workers use the default (unnamed) wrangler environment with a
      # unique `--name`. Their secrets must be injected each deploy because the
      # Worker identity is per-PR. Named environments (nightly, production)
      # have their secrets set once out-of-band via `wrangler secret put --env`
      # and are not re-uploaded on every deploy.
      - name: Inject preview Worker secrets
        if: steps.target.outputs.mode == 'preview'
        env:
          WORKER_NAME: ${{ steps.target.outputs.worker_name }}
          WORKERS_SUBDOMAIN: ${{ secrets.CLOUDFLARE_WORKERS_SUBDOMAIN }}
          SQLITE_PATH_VALUE: ${{ secrets.TURSO_URL_PREVIEW }}
          LIBSQL_AUTH_TOKEN_VALUE: ${{ secrets.TURSO_AUTH_TOKEN_PREVIEW }}
          BETTER_AUTH_SECRET_VALUE: ${{ secrets.PREVIEW_BETTER_AUTH_SECRET }}
          ENCRYPTION_KEY_VALUE: ${{ secrets.PREVIEW_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          # URLs are derived from the PR-specific Worker name so the OAuth
          # redirect and external URL match the preview's actual origin.
          preview_url="https://${WORKER_NAME}.${WORKERS_SUBDOMAIN}.workers.dev"
          put() {
            local name="$1"
            local value="$2"
            printf '%s' "$value" | vp exec wrangler secret put "$name" --name "$WORKER_NAME"
          }
          put SQLITE_PATH "$SQLITE_PATH_VALUE"
          put LIBSQL_AUTH_TOKEN "$LIBSQL_AUTH_TOKEN_VALUE"
          put BETTER_AUTH_SECRET "$BETTER_AUTH_SECRET_VALUE"
          put BETTER_AUTH_URL "$preview_url"
          put ENCRYPTION_KEY "$ENCRYPTION_KEY_VALUE"
          put APP_EXTERNAL_URL "$preview_url"

      - name: Deploy Worker
        run: vp exec wrangler deploy ${{ steps.target.outputs.wrangler_flags }}

      - name: Comment preview URL on PR
        if: steps.target.outputs.mode == 'preview'
        uses: actions/github-script@v7
        env:
          WORKER_NAME: ${{ steps.target.outputs.worker_name }}
          WORKERS_SUBDOMAIN: ${{ secrets.CLOUDFLARE_WORKERS_SUBDOMAIN }}
        with:
          script: |
            const { WORKER_NAME, WORKERS_SUBDOMAIN } = process.env;
            const url = `https://${WORKER_NAME}.${WORKERS_SUBDOMAIN}.workers.dev`;
            const marker = '<!-- cloudflare-preview-url -->';
            const body = `${marker}\nCloudflare preview: ${url}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
            }

  # Deletes the PR preview Worker when the PR is closed. `--name` is mandatory:
  # without it Wrangler would use `name = "app"` from wrangler.toml and delete
  # the wrong Worker.
  cleanup-preview:
    name: Delete preview Worker
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: [media-manager, sandboxed]
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Delete preview Worker
        run: |
          vp exec wrangler delete \
            --name app-pr-${{ github.event.pull_request.number }} \
            || echo "Preview Worker already removed"
