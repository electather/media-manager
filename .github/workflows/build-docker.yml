name: Build & Publish Docker Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "docker/**"
      - ".dockerignore"
      - ".github/workflows/build-docker.yml"
      - "package.json"
      - "bun.lock"
      - "packages/*/package.json"

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build multi-arch image
    # Runs on GitHub-hosted runners because the self-hosted `[media-manager,
    # sandboxed]` runners do not have Docker Buildx available. The build needs
    # no application secrets (only the auto-provided GITHUB_TOKEN for ghcr.io),
    # so the relaxed sandbox is not a security concern.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tags
        id: tags
        run: |
          set -euo pipefail
          image="ghcr.io/${{ github.repository }}"
          image_lc="${image,,}"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            version="${{ github.ref_name }}"
            printf 'tags<<EOF\n%s:latest\n%s:%s\nEOF\n' "$image_lc" "$image_lc" "$version" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            printf 'tags<<EOF\n%s:pr-%s\nEOF\n' "$image_lc" "${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            printf 'tags<<EOF\n%s:nightly\nEOF\n' "$image_lc" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          # PR runs validate the build without publishing to ghcr.io.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
