name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Opt every JS action into Node.js 24 ahead of the June 2026 forced cutover.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  ci:
    name: CI
    runs-on: [media-manager, sandboxed]
    permissions:
      contents: read
      pull-requests: write
      security-events: write
      issues: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          cache: true

      - name: Check code quality (lint, format, types)
        run: vp check

      - name: Run tests
        run: vp test

      - name: Fallow analysis (dead code, dupes, health)
        uses: fallow-rs/fallow@v2
        with:
          format: sarif
          comment: true
          annotations: true

      - name: Upload Fallow results to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: fallow-results.sarif

      - name: Require changeset
        if: github.event_name == 'pull_request'
        run: |
          if ! vp dlx changeset status --since=origin/${{ github.base_ref }}; then
            echo "::error::No changeset found. Run 'bunx changeset add' for package changes or 'bunx changeset add --empty' for CI/docs-only changes."
            exit 1
          fi
