name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-and-test:
    name: Quality Checks & Tests
    runs-on: [media-manager, sandboxed]
    permissions:
      checks: write
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          cache: true

      - name: Check Code Quality (Lint, Format, Types)
        run: vp check

      - name: Run Tests
        run: vp test

      - name: Report Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Vitest Results
          path: test-results/junit.xml
          reporter: java-junit
          fail-on-error: false

      - name: Require at least one changeset
        if: github.event_name == 'pull_request'
        run: |
          if ! vp dlx changeset status --since=origin/${{ github.base_ref }}; then
            echo "::error::No changeset found. Run 'bunx changeset add' for package changes or 'bunx changeset add --empty' for CI/docs-only changes."
            exit 1
          fi
