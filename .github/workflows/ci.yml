name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-and-test:
    name: Quality Checks & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          cache: true

      - name: Check Code Quality (Lint, Format, Types)
        run: vp check

      - name: Run Tests
        run: vp test

      - name: Check for Changesets
        if: github.event_name == 'pull_request'
        id: changesets
        uses: changesets/action@v1
        with:
          version: "true"
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Require at least one changeset
        if: github.event_name == 'pull_request' && steps.changesets.outputs.hasChangesets != 'true'
        run: |
          echo "::error::No changeset found. Run 'bunx changeset add' for package changes or 'bunx changeset add --empty' for CI/docs-only changes."
          exit 1
