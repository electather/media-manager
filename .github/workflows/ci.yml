name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Opt every JS action into Node.js 24 ahead of the June 2026 forced cutover.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  ci:
    permissions:
      contents: read
      pull-requests: write # fallow comment: true
      security-events: write # upload-sarif    name: CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@9446e853b27985e00fb1b21193be026fc09198db # v1
        with:
          cache: true

      - name: Generate Paraglide messages
        # setup-vp's install cache skips the apps/client prepare hook on cache
        # hits, leaving src/paraglide/* stale and breaking `vp check` whenever
        # message keys change. Run paraglide-js explicitly so generated output
        # tracks apps/client/messages.
        run: bun run --cwd apps/client prepare

      - name: Check code quality (lint, format, types)
        run: vp check

      - name: Backend module file-size and naming caps
        if: always()
        # `vp run` exposes bun on PATH via the package manager. Calling `bun`
        # directly would fail because setup-vp does not surface it.
        run: vp run check:file-sizes

      - name: Backend drizzle table-ownership
        if: always()
        run: vp run check:table-ownership

      - name: Run tests
        if: always()
        run: vp test

      - name: Fallow boundary + circular gate
        if: always()
        # Explicit hard gate on net-new error-severity findings (boundary
        # violations, new circular deps, unused files/exports). Phase 1 baselines
        # the 18 existing catalog↔preferences cycles in
        # .fallow/dead-code-baseline.json; Phase 2 typed events resolve them.
        # The SARIF + comment step below still publishes the full health report.
        run: |
          vp exec fallow audit --base origin/main \
            --dead-code-baseline .fallow/dead-code-baseline.json \
            --health-baseline .fallow/health-baseline.json \
            --dupes-baseline .fallow/dupes-baseline.json \
            --fail-on-issues --quiet

      - name: Fallow analysis (dead code, dupes, health)
        uses: fallow-rs/fallow@cb70d5823fd7ba0b9a5d33fc2a6186143668fe99 # v2
        if: always()
        with:
          format: sarif
          comment: true
          annotations: true
          # Severity is governed by .fallowrc.json (e.g. duplicates default to
          # `warn`). Let the action surface findings via SARIF + PR comment
          # without turning warnings into a hard CI gate; errors still fail
          # via fallow's own non-zero exit.
          fail-on-issues: false

      - name: Upload Fallow results to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@7c1e4cf0b20d7c1872b26569c00ba908797a59bf # v4
        if: always()
        # Code Scanning (GitHub Advanced Security) is not enabled on this
        # repository, so the upload returns "Resource not accessible by
        # integration". Surface the failure as a warning rather than a
        # hard CI gate — the fallow job summary and PR comment carry the
        # same findings.
        continue-on-error: true
        with:
          sarif_file: fallow-results.sarif

      - name: Require changeset
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if ! vp dlx changeset status --since="origin/$BASE_REF"; then
            echo "::error::No changeset found. Run 'bunx changeset add' for package changes or 'bunx changeset add --empty' for CI/docs-only changes."
            exit 1
          fi
