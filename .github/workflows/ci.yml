name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-and-test:
    name: Quality Checks & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          cache: true

      - name: Check Code Quality (Lint, Format, Types)
        run: vp check

      - name: Run Tests
        run: vp test

      - name: Check for Changesets
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}
          CHANGESETS=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- '.changeset/*.md' | grep -v 'README.md' || true)
          if [ -z "$CHANGESETS" ]; then
            echo "::error::No changeset found. Run 'bunx changeset add' for package changes, or 'bunx changeset add --empty' for CI/docs-only changes."
            exit 1
          fi
          echo "Found changeset(s):"
          echo "$CHANGESETS"
          vp dlx changeset status --since="origin/${{ github.base_ref }}"
