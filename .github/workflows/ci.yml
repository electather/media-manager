name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Opt every JS action into Node.js 24 ahead of the June 2026 forced cutover.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  ci:
    permissions:
      contents: read
      pull-requests: write # fallow comment: true
      security-events: write # upload-sarif    name: CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          cache: true

      - name: Check code quality (lint, format, types)
        run: vp check

      - name: Backend module file-size and naming caps
        if: always()
        # `vp run` exposes bun on PATH via the package manager. Calling `bun`
        # directly would fail because setup-vp does not surface it.
        run: vp run check:file-sizes

      - name: Backend drizzle table-ownership
        if: always()
        run: vp run check:table-ownership

      - name: Run tests
        if: always()
        run: vp test

      - name: Fallow boundary + circular gate
        if: always()
        # Explicit hard gate on error-severity findings (boundary_violations,
        # circular_deps, unused_files, unused_exports). The SARIF + comment
        # step below still publishes the full health report; this step is the
        # one that fails CI when an error-severity issue lands.
        run: vp exec fallow dead-code --fail-on-issues --quiet

      - name: Fallow analysis (dead code, dupes, health)
        uses: fallow-rs/fallow@v2
        if: always()
        with:
          format: sarif
          comment: true
          annotations: true
          # Severity is governed by .fallowrc.json (e.g. duplicates default to
          # `warn`). Let the action surface findings via SARIF + PR comment
          # without turning warnings into a hard CI gate; errors still fail
          # via fallow's own non-zero exit.
          fail-on-issues: false

      - name: Upload Fallow results to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        # Code Scanning (GitHub Advanced Security) is not enabled on this
        # repository, so the upload returns "Resource not accessible by
        # integration". Surface the failure as a warning rather than a
        # hard CI gate — the fallow job summary and PR comment carry the
        # same findings.
        continue-on-error: true
        with:
          sarif_file: fallow-results.sarif

      - name: Require changeset
        if: github.event_name == 'pull_request'
        run: |
          if ! vp dlx changeset status --since=origin/${{ github.base_ref }}; then
            echo "::error::No changeset found. Run 'bunx changeset add' for package changes or 'bunx changeset add --empty' for CI/docs-only changes."
            exit 1
          fi
