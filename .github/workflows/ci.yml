name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Opt every JS action into Node.js 24 ahead of the June 2026 forced cutover.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  quality-and-test:
    name: Quality Checks & Tests
    runs-on: [media-manager, sandboxed]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          cache: true

      - name: Check Code Quality (Lint, Format, Types)
        run: vp check

      - name: Run Tests
        run: vp test

      - name: Require at least one changeset
        if: github.event_name == 'pull_request'
        run: |
          if ! vp dlx changeset status --since=origin/${{ github.base_ref }}; then
            echo "::error::No changeset found. Run 'bunx changeset add' for package changes or 'bunx changeset add --empty' for CI/docs-only changes."
            exit 1
          fi
