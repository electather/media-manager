name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Perform a comprehensive code review of this pull request covering:

            1. **Code Quality**
               - Clean code principles and readability
               - Proper error handling and edge cases
               - Consistency with the existing codebase style

            2. **Security**
               - Potential vulnerabilities (injection, XSS, CSRF, etc.)
               - Unsafe use of user-supplied input
               - Exposed secrets or credentials

            3. **Performance**
               - Inefficient algorithms or unnecessary work
               - Resource leaks or unbounded memory usage
               - Opportunities for caching or batching

            4. **Testing**
               - Adequate coverage for new behaviour
               - Missing edge-case tests
               - Test quality and reliability

            5. **Documentation**
               - Public API or interface changes documented
               - Inline comments where non-obvious logic appears
               - README or changelog updates where applicable

            Post inline comments for specific line-level issues.
            Use a top-level PR comment for overall observations or a summary.
            Mark blocking issues clearly; flag minor suggestions as non-blocking.

          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"'
